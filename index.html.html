<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRIDGE – Workplace Missions</title>
<style>
:root{--bg:#F3EEE5;--sf:#FFFFFF;--sf2:#EADFCF;--tx:#2A1B24;--mu:#6B5A63;--ln:#D9CCBA;--ac:#963D68;--wr:#D58A42;--er:#A95743;--ok:#899477;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:980px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.2em 0 .4em;line-height:1.2}
h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
p{margin:.4em 0;max-width:70ch}
button{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer}
button:hover{border-color:var(--ac)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
:focus-visible{outline:3px solid var(--wr);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:4px 12px;font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.tabs button{border-radius:14px;border-width:2px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;flex:1 1 200px}
.tp{font-size:.8rem;font-weight:400;opacity:.9}
.tb{display:block;width:100%;height:5px;border-radius:5px;background:rgba(42,27,36,.14);overflow:hidden}.tb i{display:block;height:100%;background:currentColor}
.flt{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 0}.flt label{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--mu);flex:1 1 150px}
select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
.lnk{background:none;border:0;padding:0;min-height:0;color:var(--ac);text-decoration:underline;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--tc);color:var(--tt);border-color:var(--tc);font-weight:700}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-top:5px solid var(--ac);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card small,.mu{color:var(--mu)}
.tag{align-self:flex-start;border-radius:6px;padding:2px 8px;font-size:.85rem;background:var(--sf2)}
.tag.ok{background:var(--ok);color:#1f2615}
.ct{font:700 1.05rem/1.2 Georgia,"Times New Roman",serif;margin:.2em 0}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:12px 0}
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--sf2);border:2px solid var(--ln);border-radius:14px;padding:10px 14px}
.tbar[data-l="1"]{border-color:var(--wr)}.tbar[data-l="2"],.tbar[data-l="3"]{border-color:var(--er)}
#tm{font:700 1.6rem Georgia,serif;font-variant-numeric:tabular-nums}
.bar{flex:1 1 120px;height:10px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.tbar[data-l="1"] .bar i{background:var(--wr)}.tbar[data-l="2"] .bar i,.tbar[data-l="3"] .bar i{background:var(--er)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;padding:0;list-style:none}
.steps li{flex:1 1 90px;font-size:.8rem;padding:6px;border-radius:8px;background:var(--sf);border:1px solid var(--ln);text-align:center;color:var(--mu)}
.steps li.on{border-color:var(--ac);color:var(--tx);font-weight:700}.steps li.dn{background:var(--sf2)}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;overflow-wrap:anywhere}
.msg.a{background:var(--sf2);align-self:flex-start}.msg.u{background:var(--ac);color:#fff;align-self:flex-end}
.msg b{display:block;font-size:.8rem;opacity:.8}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--tx);border:2px solid var(--ln);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin:10px 0}
.crit .bar{grid-column:1/-1}
blockquote{margin:6px 0;padding:6px 12px;border-left:4px solid var(--ac);background:var(--bg);border-radius:0 8px 8px 0;overflow-wrap:anywhere}
ul{padding-left:20px}li{margin:3px 0}
.logo{display:flex;align-items:center;gap:10px}.logo b{font:700 1.7rem Georgia,serif;color:var(--ac);display:block;line-height:1}.logo small{color:var(--ac);font-size:.8rem}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}.mn{min-width:0}.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}.rail .tbar{flex-direction:column;align-items:stretch;position:static}
textarea[readonly]{margin-top:10px;min-height:160px;font-family:monospace;font-size:.8rem}
@media (max-width:760px){.lay{grid-template-columns:minmax(0,1fr)}.rail{order:-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:6}.rail .tbar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;box-shadow:0 4px 10px rgba(42,27,36,.12)}.rail .tbar svg{display:none}.rail .tbar button{min-height:36px;padding:4px 10px;font-size:.85rem}.rail .tbar>span{flex:1 1 auto;font-size:.85rem}#tw:empty{display:none}#tm{font-size:1.3rem}.steps{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:10px 0}.steps::-webkit-scrollbar{display:none}.steps li{flex:0 0 auto}button{min-height:44px}main{padding:12px 16px}h1{font-size:1.45rem}h2{font-size:1.2rem}}
html{scroll-behavior:smooth}.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 0 36px}.hero>svg:first-child{max-width:100%;height:auto}.hero b{font:700 clamp(2.6rem,11vw,4.2rem) Georgia,serif;color:var(--ac);line-height:1;margin-top:6px}.hero .tg{color:var(--ac);font-weight:600;font-size:1.1rem;margin:10px 0 2px}.hero button{margin-top:22px}.go{margin-top:8px;align-self:flex-start;background:var(--ac);color:#fff;border-radius:8px;padding:4px 16px;font-weight:700}
.cf{fill:var(--sf);stroke:var(--ln);stroke-width:3}#arc{fill:none;stroke:var(--wr);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear}.hd{stroke:var(--tx);stroke-linecap:round;transform-origin:60px 60px;transition:transform 1s linear}.tbar[data-l="2"] #arc,.tbar[data-l="3"] #arc{stroke:var(--er)}
@media print{.rail,.row,.tabs{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main id="app"></main>
<script>
const M={trade:{n:"International Trade",c:"#963D68",t:"#fff",e:"🚢"},lang:{n:"Translation",c:"#A95743",t:"#fff",e:"🗣️"},info:{n:"INFOCOM · Digital Media",c:"#899477",t:"#1f2615",e:"💻"}};
const DQ={trade:"Submit your decision or plan, and justify it.",lang:"Submit your translation or rendering, and explain your linguistic choices.",info:"Submit your solution or plan, and justify your design choices."};
const TW={trade:"a competing supplier has just undercut the market",lang:"a second reviewer disputes your terminology",info:"a stakeholder changes the requirements at the last minute"};
const CN=["Academic knowledge","Technical competence","Problem-solving","Critical thinking and decisions","Professional communication","Adaptability"];
const TIPS=["Review the core concepts for this task and name them explicitly.","Use the field’s precise terms and apply them to the case.","Offer concrete options or a step-by-step plan.","Explain why you chose it, name the risks and the trade-offs.","Write clearly and politely: greet, structure, close.","When a surprise hits, say what you will change and why."];
const T=[];
const t=(m,id,title,ch,mins,kw,brief,role,op,q1,q2)=>T.push({m,id,title,ch,mins,kw:kw.split(","),brief,role,op,q:[q1,q2]});
t("trade","neg","International business negotiation","Mr. Keller (buyer)",30,"price,quantity,payment,delivery,discount,margin","Nile Harvest Co., an Egyptian citrus exporter, is negotiating with Keller Foods, which wants 20% off for 40 containers.","Export sales manager","Your price is 20% above Spanish suppliers. Why should I pay it?","I need 90-day credit terms. What can you offer?","Can you guarantee delivery within five weeks?");
t("trade","inc","Incoterms and shipping responsibilities","Ms. Haas (buyer’s logistics)",30,"incoterms,fob,cif,risk,insurance,freight,customs","Delta Textiles ships 12 containers from Alexandria to Hamburg and must pick the delivery terms.","Logistics coordinator","Which Incoterm do you propose, and who carries the risk at sea?","Who pays for insurance and export customs?","What if the vessel is delayed?");
t("trade","doc","Export documentation","Omar (customs broker)",25,"invoice,packing list,hs code,certificate of origin,weight,consignee","A shipment’s invoice and packing list contain mismatched weights, a wrong HS code and a missing consignee address.","Export documentation officer","The paperwork closes in two hours. Where do the documents disagree?","Which document does customs check first?","How do you stop this happening again?");
t("trade","cri","International shipping crisis","Dr. Lindqvist (buyer)",30,"delay,carrier,contract,force majeure,alternative,insurance","A port strike delays your cargo and the buyer threatens to cancel the contract.","Account manager","Your cargo is stuck. I am cancelling unless you convince me otherwise.","What does our contract say about delays?","What alternative route can you offer?");
t("trade","mkt","International market entry","Mona Fathy (CEO)",40,"competitors,regulations,certification,distribution,pricing,demand","Cairo Naturals wants to sell olive-oil cosmetics in Germany and needs an entry recommendation.","Market analyst","Why Germany, and why now? Convince the board.","Who are the competitors, and how do we price?","Which regulations or certifications apply?");
t("trade","pay","International payment risk","Hassan (CFO)",30,"letter of credit,advance,open account,collection,credit risk,confirmation","A new buyer in an unfamiliar market wants open-account terms on a large order.","Trade finance officer","They want 120 days open account. Is that acceptable?","What payment method would you choose instead?","What if the issuing bank is risky?");
t("lang","bus","Professional business translation","Ms. Farouk (client)",30,"terminology,register,context,tone,accuracy,consistency","Translate a supplier contract summary between English and Arabic for a law firm.","Translator","Our last translation sounded casual. How will you handle register?","How will you keep terminology consistent?","What do you do with an ambiguous clause?");
t("lang","mtg","International meeting interpretation","Mr. Evans (investor)",25,"intent,etiquette,consecutive,note-taking,clarify,neutral","You interpret a meeting between an Egyptian company and an international investor.","Interpreter","Please tell them their valuation is unrealistic.","How will you handle a joke that does not translate?","What if you miss a number?");
t("lang","sim","Simultaneous translation challenge","Dr. Salma (conference chair)",20,"segmentation,anticipate,lag,terminology,condense,accuracy","You render a fast live keynote with technical terms and no pause.","Simultaneous interpreter","The speaker is going very fast. How do you keep up?","What do you do when you lose a sentence?","How do you manage unfamiliar terms?");
t("lang","crs","Translation crisis","Mr. Adel (client)",30,"error,mistranslation,apologize,glossary,revise,justify","A client says your translation of a safety notice is misleading.","Senior translator","This translation could cause a lawsuit. Explain yourself.","What exactly did you get wrong?","How will you prevent repeats?");
t("lang","loc","Cultural localization","Laura (brand director)",30,"culture,idiom,taboo,tone,slogan,adapt","Localize a global ad campaign for Egyptian audiences while keeping its core message.","Localization specialist","The slogan is an English pun. What do you do?","Which images or phrases may offend?","How do you keep the brand voice?");
t("lang","dip","Diplomatic translation","Ambassador’s aide",30,"protocol,nuance,neutrality,formal,sensitivity,equivalent","Translate a formal diplomatic statement without shifting its meaning.","Diplomatic translator","One word here could be read as a threat. How do you choose?","How do you keep a formal register?","Would you add or soften anything?");
t("lang","sub","Audiovisual translation and subtitling","Karim (producer)",30,"line limit,characters,timing,condense,reading speed,natural","Create Arabic subtitles for an English promo video within line and timing limits.","Subtitler","Subtitles need to fit two lines. What do you cut?","How do you handle fast dialogue?","How do you keep it natural?");
t("info","snk","Design a Snake game in 60 minutes","Nadia (lead developer)",60,"game loop,state,collision,score,controls,edge case","A studio needs a playable Snake prototype within one hour.","Game developer","Walk me through your plan for the first ten minutes.","How will you handle collisions and scoring?","Which edge cases worry you?");
t("info","med","Corporate media crisis","Editor-in-chief",30,"statement,audience,facts,timeline,channels,tone","A viral video accuses your client of safety failures. You lead the response.","Communications officer","The video has two million views. What do we say first?","Which channels do we use?","How do we sound credible and calm?");
t("info","mis","Misinformation and public response","Newsroom lead",30,"verify,source,correction,audience,platform,transparency","A false story about a public health scheme is spreading, and your outlet must respond.","Fact-check editor","How do we check this before we publish?","How do we publish a correction?","How do we reach the people who saw the lie?");
t("trade","sup","International supplier evaluation","Ms. Rashed (procurement lead)",35,"price,quality,delivery time,reliability,payment terms,risk","Choose between three overseas suppliers of packaging material with different prices, lead times and track records.","Procurement analyst","Three suppliers, one contract. Which do you recommend?","How do you weigh price against reliability?","What risks remain with your choice?");
t("trade","fair","International trade fair preparation","Mr. Brandt (potential buyer)",30,"company profile,products,follow-up,pricing,contacts,opportunity","You represent an Egyptian food exporter at a European trade fair and pitch to visiting buyers.","Trade fair representative","I have two minutes. Why is your company worth a meeting?","What are your minimum order and price?","How will you follow up after the fair?");
t("lang","leg","Legal document translation","Counsel Nabil (law firm)",35,"terminology,ambiguity,legal meaning,jurisdiction,shall,explain","Translate a commercial agreement clause. This is educational practice, not a certified legal translation.","Legal translator","This clause says “shall”. How will you render it?","How do you avoid ambiguity?","Which terms need a translator’s note?");
t("lang","csu","Multilingual customer support","Customer Ms. Duval",20,"understand,apologize,solution,tone,clarify,follow-up","Customers write complaints in several languages. You answer a frustrated customer clearly.","Support specialist","My order is late and nobody answers me. Fix this now.","Why was I not told earlier?","What will you do so it does not happen again?");
t("info","web","Build a professional website","Ms. Zaki (client)",45,"requirements,structure,responsive,navigation,accessibility,testing","A small clinic wants a professional website with services, team and booking.","Web developer","What will my website have, and in what order?","How will it work on a phone?","How will you test it before launch?");
t("info","dbg","Debug a broken application","Sam (technical supervisor)",40,"reproduce,cause,minimal fix,test,regression,log","A to-do app loses tasks after a refresh and sometimes shows duplicates.","Junior developer","Users lose tasks on refresh. Where do you start?","How do you reproduce it reliably?","How do you prove your fix works?");
t("info","cmp","Create a digital marketing campaign","Ms. Hegazy (marketing director)",35,"target audience,objectives,channels,content,kpi,budget","A local juice brand wants a four-week digital campaign for students.","Digital marketer","Who exactly are we targeting, and why?","Which channels, and how much for each?","How will we know it worked?");
t("info","ux","Design a user interface (UI/UX)","Leo (product manager)",35,"usability,user needs,navigation,hierarchy,accessibility,justify","Redesign the checkout screen of a food-delivery app with a high drop-off rate.","UI/UX designer","Users abandon checkout. What do you think is wrong?","What would you change first?","How do you justify it to the team?");
t("info","soc","Develop a social media strategy","Ms. Adly (brand owner)",30,"audience,content,engagement,posting schedule,platform,metrics","A bookstore’s social accounts get almost no engagement.","Social media manager","Our posts get ten likes. What is going wrong?","What would your first three posts be?","How will you measure improvement?");
t("info","ana","Analyze website performance","Tarek (data lead)",40,"bounce rate,conversion,traffic,metrics,weakness,recommendation","Analytics show a 78% mobile bounce rate and 1.2% conversion on a store website.","Web analyst","Mobile bounce rate is 78%. What does that tell you?","Which metric do you fix first?","What do you recommend, and why?");
t("info","cnt","Create a digital content strategy","Ms. Samir (communications head)",35,"objectives,audience,formats,editorial calendar,brand voice,consistency","A university needs one consistent digital voice across its channels.","Content strategist","Our channels sound like different organizations. Fix that.","Which content formats do you pick?","Show me how a month would look.");
Object.assign(T.find(x=>x.id==="bus"),{ch:"Ms. Farouk (legal counsel, Al-Nour Trading)",brief:"Al-Nour Trading, a Cairo import firm, needs a supplier-agreement summary translated from English into Arabic for its partner in Riyadh. Ms. Fatma Farouk, the company’s legal counsel, is your client and will review your work.",src:"Payment shall be made within 60 days of receipt of invoice. The Supplier warrants that the goods conform to the agreed specifications and shall replace any defective items at its own expense. Either party may terminate this Agreement with 30 days’ written notice.",op:"Hello, I’m Fatma Farouk, legal counsel at Al-Nour Trading. The excerpt above comes from our supplier agreement, and our partner in Riyadh needs it in Arabic by Thursday. Our last translator made it sound casual and used three different words for “warrants”. How would you approach this text, and which terms worry you most?",q:["Look at “shall replace any defective items”. How would you render “shall” and “defective”, and why?","Before you send it to me, what would you check?"],fx:{terminology:"Yes, we need one Arabic term for each concept. Our last version used three words for “warrants”.",register:"Exactly. Our partner’s lawyers will read this, so it must be formal legal Arabic, not conversational.",context:"Right. It is a supplier contract, so every term has to carry its legal meaning.",tone:"Good. Formal and neutral, please, with no friendly rewording.",accuracy:"Accuracy matters most. A wrong deadline or a wrong obligation would cost us.",consistency:"Good. A short glossary of agreed terms would make my review much faster."}});
const BEG="inc doc fair bus csu cmp soc cnt".split(" "),ADV="cri mkt sim dip leg ana med".split(" ");
const dif=id=>BEG.includes(id)?"Beginner":ADV.includes(id)?"Advanced":"Intermediate";
const LOGO='<svg width="56" height="48" viewBox="0 0 56 48" aria-hidden="true"><path d="M4 42A24 24 0 0 1 18 20.2" fill="none" stroke="#963D68" stroke-width="5"/><path d="M38 20.2A24 24 0 0 1 52 42" fill="none" stroke="#899477" stroke-width="5"/><path d="M10 42h36" stroke="#D58A42" stroke-width="4"/><text x="28" y="35" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="24" fill="#D58A42">B</text></svg>';
const KEY="bridge-sim-v1";let S,cur=null,NOTE="";const note=m=>{NOTE=m;draw()};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tk=id=>T.find(x=>x.id===id);
const el=s=>Math.floor((s.el||0)+(s.run?(Date.now()-s.ts)/1000:0));
const fmt=n=>{n=Math.max(0,n);return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")};
// Arabic equivalents for Translation-track concepts (Arabic answers are matched by substring, so clitics like ال/و/ب still match).
const AR={terminology:["مصطلح"],register:["مستوى اللغة","السجل اللغوي","أسلوب رسمي","الأسلوب الرسمي"],context:["سياق"],tone:["نبرة","لهجة"],accuracy:["دقة","دقيق"],consistency:["اتساق","توحيد","ثبات"],intent:["قصد","مقصود","نية"],etiquette:["آداب","لباقة"],consecutive:["تتابعي","تتابعية"],"note-taking":["تدوين","ملاحظات"],clarify:["توضيح","استيضاح","أوضح"],neutral:["محايد","حياد"],segmentation:["تقسيم","تجزئة"],anticipate:["توقع","أتوقع"],lag:["تأخر","فارق زمني"],condense:["اختصار","تكثيف","أختصر"],error:["خطأ","أخطاء"],mistranslation:["ترجمة خاطئة","خطأ في الترجمة"],apologize:["اعتذر","أعتذر","اعتذار","نعتذر"],glossary:["مسرد","قائمة مصطلحات","معجم"],revise:["مراجعة","أراجع","تنقيح"],justify:["تبرير","مبرر","أبرر"],culture:["ثقاف"],idiom:["تعبير اصطلاحي","مثل شعبي","أمثال"],taboo:["محظور","محرمات","تابو"],slogan:["شعار"],adapt:["تكييف","تكيف","مواءمة","تطويع"],protocol:["بروتوكول","مراسم"],nuance:["فروق دقيقة","ظلال المعنى","دلالات"],neutrality:["حياد"],formal:["رسمي","رسمية"],sensitivity:["حساسية"],equivalent:["مكافئ","معادل"],"line limit":["سطرين","عدد الأسطر","حد الأسطر"],characters:["أحرف","حروف"],timing:["توقيت","تزامن"],"reading speed":["سرعة القراءة"],natural:["طبيعي","سلس"],ambiguity:["غموض","لبس"],"legal meaning":["المعنى القانوني","معنى قانوني","دلالة قانونية"],jurisdiction:["اختصاص قضائي","ولاية قضائية","القانون الواجب التطبيق"],shall:["يلتزم","تلتزم","يتعين"],explain:["أشرح","شرح"],understand:["أفهم","أتفهم"],solution:["الحل","حلول","حلاً"],"follow-up":["متابعة","أتابع"]};
// Whole-word match ("risk" no longer matches "brisk"), allowing short endings like -s/-ed/-ing.
const RX={},kre=k=>RX[k]||(RX[k]=new RegExp("\\b"+(k.length>4?k.replace(/s$/,""):k).replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/-/g,"[- ]?").replace(/ /g,"\\s+")+"\\w{0,3}\\b","i"));
const has=(k,x)=>kre(k).test(x)||(AR[k]||[]).some(a=>x.includes(a));
// A text with 3+ concepts but fewer than 3 words per concept is a pasted keyword list, not an answer.
const stuffed=(t,x)=>{const n=t.kw.filter(k=>has(k,x)).length;return n>=3&&words(x)<n*3};
const hits=(t,...xs)=>{const ok=xs.flat().filter(x=>x&&!stuffed(t,x));return t.kw.filter(k=>ok.some(x=>has(k,x)))};
const ACK=[x=>`Good: ${x} is exactly what I need to hear about.`,x=>`That helps. You’ve clearly thought about ${x}.`,x=>`Fair point on ${x}. I can work with that.`];
const words=x=>(x.trim().match(/\S+/g)||[]).length;
const um=s=>s.msgs.filter(m=>m.r==="u"&&!m.bad).map(m=>m.t);
const qt=x=>"“"+esc(x.length>160?x.slice(0,157)+"…":x)+"”";
function pause(s){if(s&&s.run){s.el=el(s);s.run=false}}
function open_(id){cur=id;let s=S.sims[id];if(!s)s=S.sims[id]={step:1,msgs:[],draft:"",dec:"",tw:"",el:0,run:true,ts:Date.now()};else if(!s.done&&!s.run){s.run=true;s.ts=Date.now()}save();draw()}
